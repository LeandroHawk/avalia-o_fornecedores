{% extends "base.html" %}
{% block titulo %}Devolver avaliacao - CESARI{% endblock %}
{% block conteudo %}
<div class="container-tight py-4">
  <div class="card">
    <div class="card-header"><h1 class="card-title">Devolver avaliacao</h1></div>
    <div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="{{ form.motivo.id_for_label }}">Motivo</label>
          <select class="form-select" name="motivo" id="{{ form.motivo.id_for_label }}">
            {% for value,label in form.fields.motivo.choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="{{ form.comentario.id_for_label }}">Comentario</label>
          <textarea class="form-control" name="comentario" id="{{ form.comentario.id_for_label }}" rows="4" required></textarea>
        </div>
        <div class="d-flex justify-content-between">
          <a class="btn btn-outline-secondary" href="{% url 'avaliacao_detail' avaliacao.pk %}">Cancelar</a>
          <button class="btn btn-danger" type="submit">Confirmar devolucao</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
