{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}CESARI - Avaliação de Fornecedores{% endblock %}</title>
  <link href="{% static 'tabler/css/tabler.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/custom.css' %}" rel="stylesheet">
  <link href="{% static 'frontend/css/motion.css' %}" rel="stylesheet">
  {% block estilos %}{% endblock %}
</head>
<body>
  {% block header %}
    {% include "partials/header.html" %}
  {% endblock %}
  <main>
    {% include "partials/messages.html" %}
    {% block conteudo %}{% endblock %}
  </main>
  <script src="{% static 'tabler/js/tabler.min.js' %}"></script>
  <script src="{% static 'vendor/chartjs/chart.umd.js' %}"></script>
  <script src="{% static 'frontend/js/charts.js' %}"></script>
  <script src="{% static 'frontend/js/tables.js' %}"></script>
  <script src="{% static 'frontend/js/forms.js' %}"></script>
  <script src="{% static 'frontend/js/app.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
