{% load static %}
<header class="navbar navbar-expand-md navbar-dark navbar-cesari d-print-none">
  <div class="container-xl">
    <a class="navbar-brand" href="{% url 'home' %}">
      <img src="{% static 'img/logotipo-cesari-branco.png' %}" class="navbar-brand-image" alt="CESARI - Pagina inicial">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu" aria-controls="navbar-menu" aria-expanded="false" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbar-menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'avaliacao_list' %}">Avaliacoes</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'pendencias' %}">Pendencias</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/">Administracao</a></li>
        {% if request.user.is_authenticated %}
          <li class="nav-item">
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button class="btn btn-outline-light ms-md-2" type="submit">Sair</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item"><a class="btn btn-light ms-md-2" href="{% url 'login' %}">Entrar</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</header>
