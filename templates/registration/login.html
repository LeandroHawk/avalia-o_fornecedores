{% extends "base.html" %}
{% block titulo %}Entrar - CESARI{% endblock %}
{% block conteudo %}
<div class="container-tight py-5">
  <div class="card">
    <div class="card-body">
      <h1 class="h2 text-center mb-4">Acesse sua conta</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
          <input class="form-control" type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="{{ form.password.id_for_label }}">Senha</label>
          <input class="form-control" type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
        </div>
        {% if form.errors %}
          <div class="alert alert-danger">Usuario ou senha invalidos.</div>
        {% endif %}
        <button class="btn btn-primary w-100" type="submit">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
